# fee-calculator NAS 배포용 docker-compose (salary 패턴 복제)
#
# salary-meter-db(MySQL)를 공유하려고 기존 네트워크(make-app_salary-net)에 external로 연결.
# fee_calculator 스키마는 이미 생성됨.
#
# 배포 순서:
#  1) 맥북: ./gradlew bootJar  → JAR이 NAS 동기화됨
#     → NAS에서 /volume1/Make-App/fee-calculator-api-0.0.1.jar 로 복사 (deploy-fee-backend.sh)
#  2) 프론트: NAS에서 VITE_BASE=/ npm run build → build/ 생성
#  3) NAS: docker compose -f docker-compose.fee.yaml up -d

services:
  fee-backend:
    image: eclipse-temurin:21-jre-jammy
    container_name: fee-calculator-app
    restart: always
    working_dir: /app
    volumes:
      - /volume1/Make-App-fee:/app
    command: java -jar fee-calculator-api-0.0.1.jar --spring.profiles.active=nas
    environment:
      - SPRING_PROFILES_ACTIVE=nas
      - DB_PASSWORD=eddy_0613
      - JWT_SECRET=change-this-to-a-long-random-secret
    networks:
      - salary-net

  fee-frontend:
    image: nginx:alpine
    container_name: fee-calculator-frontend
    user: root
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - /volume1/Make-App-fee/fee-calculator-web/build:/usr/share/nginx/html
      - /volume1/Make-App-fee/fee-app.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - salary-net
    depends_on:
      - fee-backend

networks:
  # 기존 salary compose가 만든 네트워크를 그대로 사용 (DB 공유)
  salary-net:
    external: true
    name: make-app_salary-net
