server {
    listen 3001;
    root /usr/share/nginx/html;
    index index.html;

    # 1. 정적 파일 (SPA)
    location / {
        try_files $uri $uri/ /index.html;
        allow all;
    }

    # 2. 백엔드 프록시 (fee-backend = compose 서비스명, 포트 8091)
    location /api/ {
        proxy_pass http://fee-backend:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        allow all;
    }
}
